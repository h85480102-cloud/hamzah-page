<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حمزة فاضل | Hamzah Fadhil</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
        }
        h1 {
            font-size: 26px;
            margin: 10px 0;
            color: #d4af37;
        }
        p.bio {
            color: #aaaaaa;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn-link {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 14px 20px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-link:hover {
            background: #d4af37;
            color: #000;
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #777777;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
        .footer span {
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- https://ibb.co/xq5fDkyg -->
        <img src="رابط_صورتك_هنا" alt="حمزة فاضل" class="profile-img">

        <h1>حمزة فاضل</h1>
        
        <!-- معلوماتك الدراسية والمجال -->
        <p class="bio">
            💻 مطور ومبرمج<br>
            📚 مكمل خامس علمي<br>
            🚀 مهتم بالتقنية وتطوير المواقع
        </p>

        <!-- أزرار التواصل -->
        <a href="https://instagram.com/YOUR_USERNAME" class="btn-link" target="_blank">Instagram 📸</a>
        <a href="https://t.me/YOUR_USERNAME" class="btn-link" target="_blank">Telegram ✈️</a>
        <a href="https://tiktok.com/@YOUR_USERNAME" class="btn-link" target="_blank">TikTok 🎬</a>

        <div class="footer">
            المطور والمبرمج: <span>حمزة فاضل</span>
        </div>
    </div>

</body>
</html>
